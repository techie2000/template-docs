name: Sync Issue Status From PR

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-issue-status:
    concurrency:
      group: sync-issue-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Sync linked issue lifecycle labels
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            if (pr?.head?.repo?.fork) {
              core.info('Fork PR source detected; skipping issue status sync.')
              return
            }

            // Bot-authored PR bodies (Dependabot changelogs, release notes, commit lists)
            // are full of `#N` references to issues in upstream repos, not this one. The
            // generic reference scan below can't tell those apart from real issue links,
            // so skip status sync entirely for bots rather than risk mislabeling — or, once
            // merged, auto-closing — an unrelated issue that happens to share a number.
            const actor = pr.user?.login || ''
            if (actor.endsWith('[bot]') || actor === 'dependabot') {
              core.info('Bot PR — skipping issue status label sync.')
              return
            }

            const statusLabels = [
              {
                name: 'status: triage',
                color: 'ededed',
                description: 'Needs initial review',
              },
              {
                name: 'status: in progress',
                color: 'fbca04',
                description: 'Actively being worked on',
              },
              {
                name: 'status: done',
                color: '0e8a16',
                description: 'Work completed or merged',
              },
            ]

            for (const labelDef of statusLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelDef.name,
                })
              } catch (error) {
                if (error.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: labelDef.name,
                      color: labelDef.color,
                      description: labelDef.description,
                    })
                  } catch (createError) {
                    if (createError.status !== 422) {
                      throw createError
                    }
                  }
                } else {
                  throw error
                }
              }
            }

            const prNumber = pr.number
            const { data: prDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            const prTitle = prDetails?.title || pr?.title || ''
            const prBody = prDetails?.body || pr?.body || ''
            // Strip HTML comments before scanning for the "keep open" override so the
            // template's own guidance text can't be mistaken for a real checkbox.
            const prBodyWithoutHtmlComments = prBody.replace(/<!--[\s\S]*?-->/g, ' ')
            const keepIssuesOpenChecked = /- \[x\] keep linked issue\(s\) open\s*-\s*reason\s*:\s*\S+/i.test(
              prBodyWithoutHtmlComments
            )

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    merged
                    state
                    closingIssuesReferences(first: 50) {
                      nodes {
                        number
                      }
                    }
                  }
                }
              }
            `

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: prNumber,
            })

            const pullRequest = result.repository.pullRequest
            const closingIssues = pullRequest.closingIssuesReferences.nodes || []
            // Scan the comment-stripped body: the template's own guidance text contains
            // literal issue numbers (e.g. "Fixes #1, #2") that would otherwise be
            // mistaken for real issue references and get labeled/auto-closed.
            const prText = `${prTitle}\n${prBodyWithoutHtmlComments}`

            // Referenced (for status-label sync): any of closes/fixes/resolves/refs/relates.
            // Being merely mentioned via Refs/Relates is enough to track status, but must
            // NOT be enough to auto-close - see closingKeywordListRegex below.
            const explicitRefRegex = /\b(?:closes?|fixes?|resolves?|refs?|relates?\s+to)(?:\s+|:\s*)#(\d+)\b/gi
            // A bare `#N` scan would treat casual mentions like "see #123" as a linked
            // issue, which is unsafe now that linked issues can be auto-closed on merge.
            // Narrow the fallback to just the pattern it exists to compensate for: the
            // trailing members of a comma-separated *closing*-keyword list (e.g.
            // "Fixes #1, #2"), which GitHub's own closingIssuesReferences and
            // explicitRefRegex's singular capture both miss. Deliberately excludes
            // refs/relates - those never carry closing intent, even in a list.
            const closingKeywordListRegex = /\b(?:closes?|fixes?|resolves?)(?:\s+|:\s*)#\d+(?:\s*,\s*#\d+)+/gi

            const referencedIssueNumbers = new Set(
              closingIssues
                .map((issue) => issue.number)
                .filter((n) => Number.isInteger(n))
            )

            for (const match of prText.matchAll(explicitRefRegex)) {
              const number = Number(match[1])
              if (Number.isInteger(number)) {
                referencedIssueNumbers.add(number)
              }
            }

            // Closing-eligible (for auto-close): only issues GitHub itself treats as
            // closing targets (closingIssuesReferences), plus the trailing members of a
            // closing-keyword comma list that GitHub doesn't recognize. A plain Refs/
            // Relates mention - or any issue discovered only indirectly via another
            // issue's task list / "children:" line - is deliberately excluded, since the
            // PR never expressed closing intent for it.
            const closingEligibleIssueNumbers = new Set(
              closingIssues
                .map((issue) => issue.number)
                .filter((n) => Number.isInteger(n))
            )

            for (const listMatch of prText.matchAll(closingKeywordListRegex)) {
              for (const numberMatch of listMatch[0].matchAll(/#(\d+)/g)) {
                const number = Number(numberMatch[1])
                if (Number.isInteger(number)) {
                  referencedIssueNumbers.add(number)
                  closingEligibleIssueNumbers.add(number)
                }
              }
            }

            referencedIssueNumbers.delete(prNumber)
            closingEligibleIssueNumbers.delete(prNumber)

            const linkedIssueByNumber = new Map()

            function extractChildIssueNumbers(bodyText) {
              const numbers = new Set()
              if (!bodyText) {
                return numbers
              }

              const taskListRefs = [...bodyText.matchAll(/-\s*\[[ xX]\]\s*(?:[^\n#]*?)#(\d+)\b/gm)]
              for (const match of taskListRefs) {
                const number = Number(match[1])
                if (Number.isInteger(number)) {
                  numbers.add(number)
                }
              }

              const parentChildRefs = [...bodyText.matchAll(/\b(?:child(?:ren)?|sub-issues?)\s*:\s*([^\n]+)/gi)]
              for (const match of parentChildRefs) {
                const line = match[1] || ''
                for (const ref of line.matchAll(/#(\d+)\b/g)) {
                  const number = Number(ref[1])
                  if (Number.isInteger(number)) {
                    numbers.add(number)
                  }
                }
              }

              return numbers
            }

            for (const issueNumber of [...referencedIssueNumbers]) {
              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                })

                if (data.pull_request) {
                  continue
                }

                linkedIssueByNumber.set(data.number, {
                  number: data.number,
                  state: data.state,
                  labels: (data.labels || []).map((label) => ({
                    name: typeof label === 'string' ? label : label.name,
                  })),
                  closingEligible: closingEligibleIssueNumbers.has(data.number),
                })

                for (const childNumber of extractChildIssueNumbers(data.body || '')) {
                  referencedIssueNumbers.add(childNumber)
                }
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Referenced target #${issueNumber} not found; skipping.`)
                  continue
                }
                throw error
              }
            }

            for (const issueNumber of [...referencedIssueNumbers]) {
              if (linkedIssueByNumber.has(issueNumber) || issueNumber === prNumber) {
                continue
              }

              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                })

                if (data.pull_request) {
                  continue
                }

                linkedIssueByNumber.set(data.number, {
                  number: data.number,
                  state: data.state,
                  labels: (data.labels || []).map((label) => ({
                    name: typeof label === 'string' ? label : label.name,
                  })),
                  closingEligible: closingEligibleIssueNumbers.has(data.number),
                })
              } catch (error) {
                if (error.status !== 404) {
                  throw error
                }
              }
            }

            const linkedIssues = [...linkedIssueByNumber.values()]
            if (linkedIssues.length === 0) {
              core.info('No linked issues found for this pull request.')
              return
            }

            const desiredStatus = pullRequest.merged
              ? 'status: done'
              : pullRequest.state === 'OPEN'
                ? 'status: in progress'
                : 'status: triage'

            const allStatusNames = statusLabels.map((label) => label.name)

            for (const issue of linkedIssues) {
              const currentStatusNames = (issue.labels || [])
                .map((label) => label.name)
                .filter((name) => allStatusNames.includes(name))

              // Once an issue reaches done, do not regress it back to in progress/triage.
              const effectiveDesiredStatus = currentStatusNames.includes('status: done')
                ? 'status: done'
                : desiredStatus

              const conflictingStatusNames = currentStatusNames.filter(
                (name) => name !== effectiveDesiredStatus
              )

              const labelsAlreadyCorrect =
                conflictingStatusNames.length === 0 &&
                currentStatusNames.includes(effectiveDesiredStatus)

              if (labelsAlreadyCorrect) {
                core.info(`Issue #${issue.number} already has expected labels.`)
              } else {
                for (const labelName of conflictingStatusNames) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: labelName,
                    })
                  } catch (error) {
                    if (error.status !== 404) {
                      throw error
                    }
                  }
                }

                if (!currentStatusNames.includes(effectiveDesiredStatus)) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: [effectiveDesiredStatus],
                  })
                }

                core.info(`Issue #${issue.number} set to ${effectiveDesiredStatus}`)
              }

              // Keep label and lifecycle state in sync: a PR reference is enough to mark
              // an issue "done" above, so it must also be enough to close it. Otherwise an
              // issue can end up labeled done while staying open forever (e.g. when a PR
              // body lists multiple issues after a single closing keyword — GitHub only
              // auto-closes the first one in that list, not the rest). A maintainer can
              // still opt out via the template's "Keep linked issue(s) open" checkbox.
              // Never auto-close an issue unless the PR actually expressed closing intent
              // for it (a real GitHub closing target, or a trailing item in a closing-
              // keyword comma list). A plain Refs/Relates mention, or an issue discovered
              // only indirectly via another issue's task list / "children:" line, is not
              // enough - closing it would be an unintended side effect.
              if (effectiveDesiredStatus === 'status: done' && String(issue.state).toLowerCase() === 'open') {
                if (!issue.closingEligible) {
                  core.info(`Issue #${issue.number} left open: no closing intent expressed for it on PR #${prNumber}.`)
                } else if (keepIssuesOpenChecked) {
                  core.info(`Issue #${issue.number} left open: "Keep linked issue(s) open" checked on PR #${prNumber}.`)
                } else {
                  // The explanatory comment is best-effort: if it fails (permissions,
                  // rate limiting, locked issue), still attempt the close so the issue
                  // doesn't stay open just because the comment couldn't be posted.
                  try {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      body: `Closing automatically: linked PR #${prNumber} merged.`,
                    })
                  } catch (error) {
                    core.warning(`Failed to comment on issue #${issue.number}: ${error.message}`)
                  }

                  try {
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      state: 'closed',
                    })
                    core.info(`Issue #${issue.number} closed (linked PR #${prNumber} merged)`)
                  } catch (error) {
                    core.warning(`Failed to close issue #${issue.number}: ${error.message}`)
                  }
                }
              }
            }
