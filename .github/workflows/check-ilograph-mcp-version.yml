name: Check ilograph MCP Server Version

on:
  workflow_dispatch: {}
  schedule:
    # Monthly, on the 1st at 09:00 UTC. Upstream release cadence is unknown,
    # so this is a cheap periodic check rather than a tuned interval.
    - cron: '0 9 1 * *'

permissions:
  contents: read
  issues: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare pinned tag against latest published release
        id: check
        env:
          IMAGE: quincymillerdev/ilograph-mcp-server
        run: |
          set -euo pipefail

          PINNED="$(grep -oE 'ilograph-mcp-server:[A-Za-z0-9._-]+' .vscode/mcp.json | head -n 1 | cut -d: -f2)"
          if [ -z "${PINNED}" ]; then
            echo "Could not find a pinned ilograph-mcp-server tag in .vscode/mcp.json" >&2
            exit 1
          fi
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

          TOKEN="$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE}:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"

          curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${IMAGE}/tags/list" > "${RUNNER_TEMP}/tags.json"

          LATEST="$(python3 - "${RUNNER_TEMP}/tags.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1]) as f:
              tags = json.load(f).get("tags", [])

          def parse(tag):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(int(x) for x in m.groups()) if m else None

          versions = sorted((v, t) for t in tags for v in [parse(t)] if v is not None)
          print(versions[-1][1] if versions else "")
          PY
          )"

          if [ -z "${LATEST}" ]; then
            echo "No semver-style tags (X.Y.Z) found on ghcr.io/${IMAGE}; skipping comparison." >&2
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

          if [ "${PINNED}" != "${LATEST}" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure mcp-image-update label exists
        if: steps.check.outputs.has_update == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const labelDef = {
              name: 'mcp-image-update',
              color: '0075ca',
              description: 'A pinned MCP server container image has a newer release available',
            }
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: labelDef.name })
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...labelDef })
              } else {
                throw e
              }
            }

      - name: Create or update tracking issue
        if: steps.check.outputs.has_update == 'true'
        uses: actions/github-script@v9
        env:
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
        with:
          script: |
            const pinned = process.env.PINNED
            const latest = process.env.LATEST
            const title = 'chore(mcp): newer ilograph-mcp-server image available'
            const body = [
              `A newer release of \`ghcr.io/quincymillerdev/ilograph-mcp-server\` is available.`,
              '',
              `- Pinned: \`${pinned}\``,
              `- Latest: \`${latest}\``,
              '',
              'Update the tag in `.vscode/mcp.json` and `.mcp.json` (must stay in sync) after',
              'checking the release notes: https://github.com/quincymillerdev/ilograph-mcp-server/pkgs/container/ilograph-mcp-server/versions',
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mcp-image-update',
              per_page: 10,
            })
            const openIssue = existing.find(i => !i.pull_request)

            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              })
              core.info(`Updated existing issue #${openIssue.number}`)
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['mcp-image-update', 'dependencies'],
              })
              core.info(`Created issue #${created.number}: ${created.html_url}`)
            }
