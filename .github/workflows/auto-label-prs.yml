name: Auto Label PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  auto-label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure no-issue-needed label and apply when eligible
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const actor = pr.user.login
            const isBotActor = actor.endsWith('[bot]') || actor === 'dependabot'

            if (pr?.head?.repo?.fork) {
              core.info('Fork PR source detected; skipping PR label mutations.')
              return
            }

            const noIssueLabelDef = {
              name: 'no-issue-needed',
              color: 'cccccc',
              description: 'PR does not require a backing issue',
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: noIssueLabelDef.name,
              })
            } catch (e) {
              if (e.status === 404) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: noIssueLabelDef.name,
                    color: noIssueLabelDef.color,
                    description: noIssueLabelDef.description,
                  })
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError
                  }
                }
              } else {
                throw e
              }
            }

            const noIssueChecked = /- \[x\] no linked issue\s*-\s*reason\s*:\s*\S+/i.test(pr.body || '')
            if (!isBotActor && !noIssueChecked) {
              core.info('No auto-label condition met.')
              return
            }

            const existingLabelNames = (pr.labels || []).map((l) =>
              typeof l === 'string' ? l : l.name
            )

            if (existingLabelNames.includes('no-issue-needed')) {
              core.info('no-issue-needed already present.')
              return
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['no-issue-needed'],
            })

            core.info(`Applied no-issue-needed on PR #${pr.number}`)

