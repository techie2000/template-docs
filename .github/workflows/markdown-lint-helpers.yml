name: Markdown lint helpers

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
      - '.markdownlintignore'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - 'scripts/lint-docs.ps1'
      - 'scripts/lint-docs.sh'
      - 'scripts/bootstrap-package-name.ps1'
      - 'scripts/bootstrap-package-name.sh'
      - '.github/workflows/markdown-lint-helpers.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
      - '.markdownlintignore'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - 'scripts/lint-docs.ps1'
      - 'scripts/lint-docs.sh'
      - 'scripts/bootstrap-package-name.ps1'
      - 'scripts/bootstrap-package-name.sh'
      - '.github/workflows/markdown-lint-helpers.yml'

permissions:
  contents: read

jobs:
  lint-helper-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Bash markdown lint helper
        run: bash ./scripts/lint-docs.sh

      - name: Validate PowerShell markdown lint helper
        shell: pwsh
        run: pwsh ./scripts/lint-docs.ps1
